name: Oxigraph Memory Scale Bake-off
on:
  pull_request:
    paths:
      - 'agent-memory-bakeoff/**'
      - '.github/workflows/agent-memory-scale.yml'
  push:
    branches:
      - 'poc/agent-memory-oxigraph-bakeoff'
    paths:
      - 'agent-memory-bakeoff/**'
      - '.github/workflows/agent-memory-scale.yml'
  workflow_dispatch:
jobs:
  scales:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install matched SPARQL engines
        run: python -m pip install --disable-pip-version-check pyoxigraph==0.5.11 rdflib==7.5.0
      - name: Compare 85 to 8500 quads
        working-directory: agent-memory-bakeoff
        run: python ci_scale.py
      - name: Upload performance and correctness results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-scale-bakeoff-results
          path: agent-memory-bakeoff/results/ci-scale.json
          if-no-files-found: warn
