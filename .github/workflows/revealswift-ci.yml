name: RevealSwift CI

on:
  push:
    paths:
      - "revealswift/**"
      - ".github/workflows/revealswift-ci.yml"
  pull_request:
    paths:
      - "revealswift/**"
      - ".github/workflows/revealswift-ci.yml"

concurrency:
  group: revealswift-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-core:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: cd revealswift && swift test

  macos-render:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: swift --version
      - run: cd revealswift && swift test
      - run: cd revealswift && swift build -c release
      - name: Validate bundled themes
        run: |
          cd revealswift
          for theme in minimal-dark dark-mode apple-inspired google-inspired amazon-inspired; do
            .build/release/revealswift themes validate "Themes/$theme"
          done
      - name: Review demo deck
        run: cd revealswift && .build/release/revealswift review Examples/demo.html --theme Themes/minimal-dark --output review-artifacts --animation-frames 0,250,500 --pdf --strict
      - name: Verify review artifacts
        run: cd revealswift && test -s review-artifacts/report.json && test -s review-artifacts/contact-sheet.png && test -s review-artifacts/deck.pdf && test -n "$(find review-artifacts/screenshots -name '*.png' -print -quit)"
      - name: Validate embedded Reveal plugins
        run: cd revealswift && .build/release/revealswift inspect Examples/plugins.html --theme Themes/minimal-dark --strict

      - name: Run Reveal.js behavioral conformance
        run: |
          cd revealswift
          rm -rf conformance-artifacts
          mkdir -p conformance-artifacts
          .build/release/revealswift conformance Examples/reveal-conformance.html             --theme Themes/minimal-dark             --output conformance-artifacts/conformance.json
          python3 - <<'PY'
import json
from pathlib import Path
p = Path("conformance-artifacts/conformance.json")
data = json.loads(p.read_text())
assert data["failed"] == 0, data
assert data["passed"] >= 25, data
assert data["skipped"] == 1, data
names = {a["name"]: a["status"] for a in data["assertions"]}
required = [
    "core.vertical-navigation",
    "core.fragments.events",
    "core.overview-enter",
    "core.pause",
    "core.background-color",
    "core.background-gradient",
    "core.background-image",
    "core.auto-animate.event",
    "plugin.markdown.converted",
    "plugin.highlight.hljs",
    "plugin.notes.content",
    "plugin.search.navigation",
    "plugin.zoom.activate",
    "plugin.custom.api",
    "library.chartjs.instance",
    "core.image-data-uri",
    "core.iframe-srcdoc",
]
missing = [name for name in required if names.get(name) != "pass"]
assert not missing, missing
PY

      - name: Visually review full Reveal.js conformance deck
        run: |
          cd revealswift
          .build/release/revealswift review Examples/reveal-conformance.html             --theme Themes/minimal-dark             --output conformance-artifacts/review             --animation-frames 0,80,160             --pdf             --strict

      - name: Verify conformance render artifacts
        run: |
          cd revealswift
          test -s conformance-artifacts/conformance.json
          test -s conformance-artifacts/review/report.json
          test -s conformance-artifacts/review/contact-sheet.png
          test -s conformance-artifacts/review/deck.pdf
          test -n "$(find conformance-artifacts/review/screenshots -name '*.png' -print -quit)"
      - name: Author a deck through the CLI
        run: |
          cd revealswift
          rm -rf authoring-smoke
          mkdir -p authoring-smoke

          .build/release/revealswift deck create authoring-smoke/agent-deck.html --title "Agent Authored Deck" --theme dark-mode --outline title,architecture,metrics

          .build/release/revealswift slide set authoring-smoke/agent-deck.html architecture --html '<h2>Architecture</h2><div class="two-column"><div class="card fragment" data-rs-component="card"><h3>Runtime</h3><p>Native WebKit rendering.</p></div><div class="card fragment" data-rs-component="card"><h3>QA</h3><p>Deterministic review.</p></div></div>'
          echo '<h2>Metrics</h2><div class="three-column"><div class="metric" data-rs-component="metric"><div class="metric-value">0</div><p>Node installs</p></div><div class="metric" data-rs-component="metric"><div class="metric-value">100%</div><p>offline runtime</p></div><div class="metric" data-rs-component="metric"><div class="metric-value">2</div><p>CPU architectures</p></div></div>' | .build/release/revealswift slide set authoring-smoke/agent-deck.html metrics --stdin

          .build/release/revealswift slide prepend authoring-smoke/agent-deck.html architecture --html '<p class="eyebrow">Agent edited</p>'
          .build/release/revealswift slide append authoring-smoke/agent-deck.html architecture --html '<p class="caption" id="review-note" data-rs-caption>Incremental edits preserve the rest of the slide.</p>'
          .build/release/revealswift element set-text authoring-smoke/agent-deck.html architecture 'h2' --text 'System Architecture'
          .build/release/revealswift element set-html authoring-smoke/agent-deck.html architecture '#review-note' --html 'Reviewed through scoped DOM editing.'
          .build/release/revealswift element add-class authoring-smoke/agent-deck.html architecture '.card' --class 'agent-edited'
          .build/release/revealswift element get authoring-smoke/agent-deck.html architecture '#review-note'
          .build/release/revealswift element remove-class authoring-smoke/agent-deck.html architecture '.card' --class 'agent-edited'

          .build/release/revealswift stack create authoring-smoke/agent-deck.html --id deep-dive --after architecture
          .build/release/revealswift stack add authoring-smoke/agent-deck.html deep-dive --id deep-dive-overview --html '<h2>Deep Dive</h2><div class="card" data-rs-component="card"><h3>Overview</h3><p>Vertical navigation groups supporting detail.</p></div>'
          .build/release/revealswift stack add authoring-smoke/agent-deck.html deep-dive --id deep-dive-details --html '<h2>Details</h2><div class="two-column"><div class="card" data-rs-component="card"><h3>Offline</h3><p>Bundled runtime.</p></div><div class="card" data-rs-component="card"><h3>Native</h3><p>WKWebView rendering.</p></div></div>'
          .build/release/revealswift stack add authoring-smoke/agent-deck.html deep-dive --id deep-dive-temp --html '<h2>Temporary</h2><p>This slide will be removed.</p>'
          .build/release/revealswift slide prepend authoring-smoke/agent-deck.html deep-dive-details --html '<p class="eyebrow">Vertical child</p>'
          .build/release/revealswift element set-text authoring-smoke/agent-deck.html deep-dive-details 'h2' --text 'Implementation Details'
          .build/release/revealswift slide get authoring-smoke/agent-deck.html deep-dive-details
          .build/release/revealswift stack move authoring-smoke/agent-deck.html deep-dive deep-dive-details --before deep-dive-overview
          .build/release/revealswift stack list authoring-smoke/agent-deck.html deep-dive
          .build/release/revealswift stack remove authoring-smoke/agent-deck.html deep-dive deep-dive-temp

          .build/release/revealswift slide add authoring-smoke/agent-deck.html --id conclusion --after metrics --class section-slide --html '<h2>Ready for agents</h2><p>Author, review, and export with one binary.</p>'
          .build/release/revealswift slide duplicate authoring-smoke/agent-deck.html conclusion --id conclusion-copy
          .build/release/revealswift slide rename authoring-smoke/agent-deck.html conclusion-copy --id appendix
          .build/release/revealswift slide move authoring-smoke/agent-deck.html appendix --before conclusion
          .build/release/revealswift slide remove authoring-smoke/agent-deck.html appendix

          .build/release/revealswift slide list authoring-smoke/agent-deck.html
          .build/release/revealswift deck info authoring-smoke/agent-deck.html
          .build/release/revealswift deck outline authoring-smoke/agent-deck.html
          .build/release/revealswift deck validate authoring-smoke/agent-deck.html
          .build/release/revealswift review authoring-smoke/agent-deck.html --output authoring-smoke/review --strict

      - name: Verify authored deck artifacts
        run: |
          cd revealswift
          test -s authoring-smoke/agent-deck.html
          test -s authoring-smoke/review/report.json
          test -s authoring-smoke/review/contact-sheet.png
          grep -q 'System Architecture' authoring-smoke/agent-deck.html
          grep -q 'deep-dive-details' authoring-smoke/agent-deck.html
          grep -q 'Implementation Details' authoring-smoke/agent-deck.html
          ! grep -q 'deep-dive-temp' authoring-smoke/agent-deck.html

      - name: Review reference theme decks
        run: |
          cd revealswift
          mkdir -p theme-review-artifacts
          for theme in dark-mode apple-inspired google-inspired amazon-inspired; do
            .build/release/revealswift review               "Examples/themes/$theme.html"               --theme "Themes/$theme"               --output "theme-review-artifacts/$theme"               --strict
          done
      - name: Verify theme review artifacts
        run: |
          cd revealswift
          for theme in dark-mode apple-inspired google-inspired amazon-inspired; do
            test -s "theme-review-artifacts/$theme/report.json"
            test -s "theme-review-artifacts/$theme/contact-sheet.png"
            test -n "$(find "theme-review-artifacts/$theme/screenshots" -name '*.png' -print -quit)"
          done
      - name: Package macOS binaries
        run: |
          cd revealswift
          mkdir -p dist
          cp .build/release/revealswift dist/revealswift-macos-arm64
          chmod +x dist/revealswift-macos-arm64
          codesign --force --sign - --timestamp=none dist/revealswift-macos-arm64
          ./dist/revealswift-macos-arm64 version

          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          set +e
          swift build -c release \
            --triple x86_64-apple-macosx14.0 \
            --sdk "$SDK" \
            --scratch-path .build-x86_64
          X86_STATUS=$?
          set -e

          if [ "$X86_STATUS" -eq 0 ]; then
            X86_BIN="$(swift build -c release \
              --triple x86_64-apple-macosx14.0 \
              --sdk "$SDK" \
              --scratch-path .build-x86_64 \
              --show-bin-path)/revealswift"
            lipo -create .build/release/revealswift "$X86_BIN" -output dist/revealswift-macos-universal
            chmod +x dist/revealswift-macos-universal
            codesign --force --sign - --timestamp=none dist/revealswift-macos-universal
            file dist/revealswift-macos-universal
            ./dist/revealswift-macos-universal version
          else
            echo "::warning::x86_64 cross-build was not available; arm64 artifact remains valid"
          fi

          cp THIRD_PARTY_NOTICES.md dist/
          mkdir -p dist/themes
          cp -R Themes/minimal-dark dist/themes/
          cp -R Themes/dark-mode dist/themes/
          cp -R Themes/apple-inspired dist/themes/
          cp -R Themes/google-inspired dist/themes/
          cp -R Themes/amazon-inspired dist/themes/
          (cd dist && shasum -a 256 revealswift-macos-* > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: revealswift-review
          path: |
            revealswift/review-artifacts
            revealswift/theme-review-artifacts
            revealswift/conformance-artifacts
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: revealswift-macos
          path: revealswift/dist
