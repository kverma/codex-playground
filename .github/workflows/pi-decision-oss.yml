name: Pi decision optimizer OSS verification
on:
  push:
    branches: [experiment/pi-decision-optimizer-oss]
  pull_request:
    paths: ['experiments/pi-decision-oss/**', '.github/workflows/pi-decision-oss.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install open-source inference dependencies
        run: pip install --disable-pip-version-check 'transformers==4.44.2' 'torch>=2.3,<3' 'numpy<2'
      - name: Run real model inference
        run: python experiments/pi-decision-oss/infer.py
      - name: Optimize and evaluate on untouched test partition
        run: node experiments/pi-decision-oss/optimize.mjs
      - name: Publish verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-decision-oss-evidence
          path: experiments/pi-decision-oss/results/
          if-no-files-found: warn
