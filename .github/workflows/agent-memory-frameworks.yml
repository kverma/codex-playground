name: Agent Memory Framework Bake-off (no LLM)
on:
  push:
    branches: [poc/agent-memory-oxigraph-bakeoff]
    paths: [agent-memory-bakeoff/**, .github/workflows/agent-memory-frameworks.yml]
  pull_request:
    paths: [agent-memory-bakeoff/**, .github/workflows/agent-memory-frameworks.yml]
  workflow_dispatch:
jobs:
  graphiti:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/graphiti-password
        ports: [7687:7687, 7474:7474]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p graphiti-password 'RETURN 1' || exit 1"
          --health-interval 5s --health-timeout 15s --health-retries 36
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'graphiti-core==0.31.1' 'httpx>=0.27,<1'
      - name: Graphiti version
        run: python -m pip show graphiti-core neo4j
      - name: Native Graphiti episode+search
        working-directory: agent-memory-bakeoff
        run: python memory_framework_bakeoff.py graphiti
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graphiti-no-llm-results
          path: agent-memory-bakeoff/results/graphiti-no-llm.json
          if-no-files-found: warn
  hindsight:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install hindsight-client
      - name: Start real Hindsight server, local embeddings, zero-LLM chunks mode
        run: |
          docker run -d --name hindsight -p 8888:8888 -p 9999:9999 \
            -e HINDSIGHT_API_LLM_PROVIDER=openai \
            -e HINDSIGHT_API_LLM_API_KEY=not-used \
            -e HINDSIGHT_API_RETAIN_EXTRACTION_MODE=chunks \
            -e HINDSIGHT_API_ENABLE_RERANKING=false \
            -e HINDSIGHT_API_EMBEDDINGS_PROVIDER=local \
            -e HINDSIGHT_API_EMBEDDINGS_LOCAL_MODEL=BAAI/bge-small-en-v1.5 \
            ghcr.io/vectorize-io/hindsight:latest
      - name: Check readiness and report startup errors
        run: |
          ok=0
          for i in $(seq 1 120); do
            if curl -fsS --max-time 4 http://127.0.0.1:8888/version > /tmp/hindsight-version.json; then ok=1; break; fi
            sleep 5
          done
          docker logs --tail 90 hindsight || true
          if [ "$ok" != 1 ]; then exit 1; fi
          cat /tmp/hindsight-version.json
      - name: Native Hindsight retain+recall
        working-directory: agent-memory-bakeoff
        run: python memory_framework_bakeoff.py hindsight
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hindsight-no-llm-results
          path: agent-memory-bakeoff/results/hindsight-no-llm.json
          if-no-files-found: warn
