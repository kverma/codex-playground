name: Atlas Cassandra POC
on:
  push:
    paths: ['atlas-cassandra-poc/**', '.github/workflows/atlas-cassandra-poc.yml']
  pull_request:
    paths: ['atlas-cassandra-poc/**', '.github/workflows/atlas-cassandra-poc.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: atlas-cassandra-poc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: make build
      - run: make up
      - run: make grade
      - name: Cassandra diagnostics
        if: always()
        run: docker compose logs --no-color > build/cassandra.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-poc-evidence
          path: |
            atlas-cassandra-poc/build/reports/
            atlas-cassandra-poc/build/test-results/
            atlas-cassandra-poc/build/cassandra.log
      - run: make down
        if: always()
