<!doctype html>
<html>
<head><meta charset="utf-8"><title>Dark Mode Review</title></head>
<body>
<div class="reveal"><div class="slides">
<section class="title-slide">
  <p class="eyebrow">RevealSwift Theme</p>
  <h1>Dark Mode Review</h1>
  <p class="subtitle">High-contrast presentation surfaces for technical and executive decks.</p>
</section>

<section>
  <h2>Key signals</h2>
  <div class="three-column">
    <div class="metric fragment" data-rs-component="metric">
      <div class="metric-value">99.99%</div><p>availability</p>
    </div>
    <div class="metric fragment" data-rs-component="metric">
      <div class="metric-value">31ms</div><p>p95 latency</p>
    </div>
    <div class="metric fragment" data-rs-component="metric">
      <div class="metric-value">3</div><p>regions</p>
    </div>
  </div>
</section>

<section>
  <h2>System health</h2>
  <div class="chart" data-rs-component="chart">
    <canvas id="theme-chart" data-rs-inline-ok></canvas>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
      if (!window.Chart) return;
      const s = getComputedStyle(document.documentElement);
      const palette = [1,2,3].map(i => s.getPropertyValue('--rs-chart-' + i).trim());
      new Chart(document.getElementById('theme-chart'), {
        type: 'bar',
        data: {
          labels: ["Availability","Latency","Regions"],
          datasets: [{ label: 'Index', data: [99,72,83], backgroundColor: palette }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } }
        }
      });
    }, 100));
  </script>
</section>
</div></div>
</body>
</html>
