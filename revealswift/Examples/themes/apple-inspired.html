<!doctype html>
<html>
<head><meta charset="utf-8"><title>Clarity at a glance.</title></head>
<body>
<div class="reveal"><div class="slides">
<section class="title-slide">
  <p class="eyebrow">Apple-inspired</p>
  <h1>Clarity at a glance.</h1>
  <p class="subtitle">Spacious typography, restrained surfaces, and focused visual hierarchy.</p>
</section>

<section>
  <h2>Key signals</h2>
  <div class="three-column">
    <div class="metric fragment" data-rs-component="metric">
      <div class="metric-value">2×</div><p>faster workflow</p>
    </div>
    <div class="metric fragment" data-rs-component="metric">
      <div class="metric-value">48%</div><p>less friction</p>
    </div>
    <div class="metric fragment" data-rs-component="metric">
      <div class="metric-value">1</div><p>clear story</p>
    </div>
  </div>
</section>

<section>
  <h2>Experience trend</h2>
  <div class="chart" data-rs-component="chart">
    <canvas id="theme-chart" data-rs-inline-ok></canvas>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => setTimeout(() => {
      if (!window.Chart) return;
      const s = getComputedStyle(document.documentElement);
      const palette = [1,2,3].map(i => s.getPropertyValue('--rs-chart-' + i).trim());
      new Chart(document.getElementById('theme-chart'), {
        type: 'bar',
        data: {
          labels: ["Discover","Decide","Complete"],
          datasets: [{ label: 'Index', data: [62,78,91], backgroundColor: palette }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          animation: false,
          plugins: { legend: { display: false } }
        }
      });
    }, 100));
  </script>
</section>
</div></div>
</body>
</html>
